# General
seed: 77
exp_name: "Pred-EQA-Gemini"
output_parent_dir: "results"
scene_dataset_config_path: "/home/dani/concept-scenesplat/EXPRESS-Bench/data/versioned_data/hm3d-0.2/hm3d/hm3d_annotated_basis.scene_dataset_config.json"
scene_data_path: "/home/dani/concept-scenesplat/EXPRESS-Bench/data/versioned_data/hm3d-0.2/hm3d/"
questions_list_path: '/home/dani/concept-scenesplat/Pred-EQA/data/express-bench.json'

# VLM Configuration for Gemini
vlm:
  provider: "gemini"
  model: "gemini-robotics-er-2-preview"
  base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
  rate_limit_delay_sec: 4.0

# major settings
choose_every_step: true
egocentric_views: true

# camera, image
camera_height: 1.5
camera_tilt_deg: -30
img_width: 1280
img_height: 1280
hfov: 120

# whether to save visualization
save_visualization: true
concept_graph_config_path: "/home/dani/concept-scenesplat/Pred-EQA/cfg/concept_graph_default.yaml"

# the image size for prompting VLM
prompt_h: 640 
prompt_w: 640 

# navigation
num_step: 50
init_clearance: 0.3
extra_view_phase_1: 2
extra_view_angle_deg_phase_1: 60
extra_view_phase_2: 6  
extra_view_angle_deg_phase_2: 40  

# about tsdf, depth map, and frontier updates
explored_depth: 1.7
tsdf_grid_size: 0.1
margin_w_ratio: 0.25
margin_h_ratio: 0.6
planner:
  eps: 1
  max_dist_from_cur_phase_1: 1
  max_dist_from_cur_phase_2: 1
  final_observe_distance: 0.75
  surrounding_explored_radius: 0.7

  # about frontier selection
  frontier_edge_area_min: 4
  frontier_edge_area_max: 6
  frontier_area_min: 8
  frontier_area_max: 9
  min_frontier_area: 20
  max_frontier_angle_range_deg: 150
  region_equal_threshold: 0.95

# about scene graph construction
scene_graph:
  confidence: 0.003
  nms_threshold: 0.1
  iou_threshold: 0.5
  obj_include_dist: 3.5
  target_obj_iou_threshold: 0.6
